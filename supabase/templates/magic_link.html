<!doctype html>
<html lang="en">
  <body style="margin:0;padding:0;background:#0b1020;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#0b1020;padding:40px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:420px;background:#141a2e;border-radius:20px;padding:32px;border:1px solid #232b45;">
            <tr>
              <td style="color:#a5b4fc;font-size:13px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;">Smart Assistant</td>
            </tr>
            <tr>
              <td style="color:#f1f5f9;font-size:22px;font-weight:700;padding-top:12px;">Your sign-in code</td>
            </tr>
            <tr>
              <td style="color:#94a3b8;font-size:15px;line-height:1.5;padding-top:8px;">Enter this code on the device you are signing in on. It expires soon and can only be used once.</td>
            </tr>
            <tr>
              <td align="center" style="padding:28px 0 20px;">
                <div style="display:inline-block;background:#0b1020;border:1px solid #2e3858;border-radius:14px;padding:16px 24px;color:#ffffff;font-size:34px;font-weight:700;letter-spacing:.35em;font-family:'SF Mono',Menlo,Consolas,monospace;">{{ .Token }}</div>
              </td>
            </tr>
            <tr>
              <td style="color:#64748b;font-size:13px;line-height:1.5;">Didn't request this? Ignore this e-mail – nobody can sign in without the code.</td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
